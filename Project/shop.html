<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<script src="https://cdn.jsdelivr.net/npm/@tailwindcss/browser@4"></script>
<link rel="stylesheet"
href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.13.1/font/bootstrap-icons.min.css">
<title>Shop</title>
</head>

<body class="bg-white">

<!-- Breadcrumb -->
<section class="bg-gray-100 py-6">
    <div class="max-w-7xl mx-auto px-6">
        <h2 class="text-3xl font-semibold mb-2">Shop</h2>

        <div class="flex items-center gap-3 text-sm">
            <a href="home.html" class="font-semibold hover:text-pink-500">Home</a>
            <span>/</span>
            <span class="text-pink-500">Products</span>
        </div>
    </div>
</section>


<!-- Shop Section -->
<section class="max-w-7xl mx-auto px-6 py-12">

<div class="grid lg:grid-cols-4 gap-8">

    <!-- Sidebar -->
    <aside class="space-y-8">

        <!-- Availability -->
        <div class="border rounded-lg p-5">

            <h3 class="text-xl font-semibold mb-4">
                Availability
            </h3>

            <div class="space-y-3">

                <label class="flex items-center gap-3">
                    <input type="checkbox">
                    In Stock (41)
                </label>

                <label class="flex items-center gap-3">
                    <input type="checkbox">
                    Out of Stock (6)
                </label>

            </div>

        </div>


        <!-- Price -->

        <div class="border rounded-lg p-5">

            <h3 class="text-xl font-semibold mb-4">
                Price
            </h3>

            <input type="range" class="w-full">

            <div class="flex justify-between mt-3">

                <span>$10</span>
                <span>$300</span>

            </div>

        </div>


        <!-- Categories -->

        <div class="border rounded-lg p-5">

            <h3 class="text-xl font-semibold mb-4">
                Categories
            </h3>

            <div class="space-y-3">

                <p class="hover:text-pink-500 cursor-pointer">
                    Roses
                </p>

                <p class="hover:text-pink-500 cursor-pointer">
                    Bouquets
                </p>

                <p class="hover:text-pink-500 cursor-pointer">
                    Tulips
                </p>

                <p class="hover:text-pink-500 cursor-pointer">
                    Wedding
                </p>

            </div>

        </div>

    </aside>


    <!-- Right Content -->
    <div class="lg:col-span-3">


        <!-- Banner -->

        <div class="relative rounded-xl overflow-hidden mb-10">

            <img src="https://images.unsplash.com/photo-1526045478516-99145907023c?w=1400"
            class="w-full h-64 object-cover">

            <div class="absolute inset-0 bg-pink-200/60 flex items-center">

                <div class="ml-12">

                    <p class="text-red-500 text-3xl mb-2">
                        New Collection
                    </p>

                    <h2 class="text-5xl font-bold mb-3">
                        Flowers Bouquet
                    </h2>

                    <p class="text-3xl text-red-500">
                        From $18.00
                    </p>

                </div>

            </div>

        </div>


        <!-- Top Bar -->

        <div class="flex justify-between items-center mb-8">

            <p class="text-gray-500">
                Showing 1–8 of 24 products
            </p>

            <select class="border p-2 rounded">

                <option>Default Sorting</option>
                <option>Price Low to High</option>
                <option>Price High to Low</option>
                <option>Newest</option>

            </select>

        </div>


        <!-- Products -->

        <div class="grid sm:grid-cols-2 lg:grid-cols-3 gap-8">


            <!-- Card -->

            <div class="group">

                <div class="overflow-hidden rounded-lg relative">

                    <img src="https://images.unsplash.com/photo-1490750967868-88aa4486c946?w=600"
                    class="w-full h-80 object-cover group-hover:scale-110 duration-500">

                    <button class="absolute bottom-0 left-0 right-0 bg-black text-white py-3
                    translate-y-full group-hover:translate-y-0 duration-500">
                        Add To Cart
                    </button>

                </div>

                <h3 class="mt-4 text-xl font-semibold">
                    Red Rose
                </h3>

                <p class="text-pink-500 text-lg">
                    $30.00
                </p>

            </div>


            <div class="group">

                <div class="overflow-hidden rounded-lg relative">

                    <img src="https://images.unsplash.com/photo-1468327768560-75b778cbb551?w=600"
                    class="w-full h-80 object-cover group-hover:scale-110 duration-500">

                    <button class="absolute bottom-0 left-0 right-0 bg-black text-white py-3
                    translate-y-full group-hover:translate-y-0 duration-500">
                        Add To Cart
                    </button>

                </div>

                <h3 class="mt-4 text-xl font-semibold">
                    White Lily
                </h3>

                <p class="text-pink-500 text-lg">
                    $45.00
                </p>

            </div>


            <div class="group">

                <div class="overflow-hidden rounded-lg relative">

                    <img src="https://images.unsplash.com/photo-1455656678494-4d1b5f3e7ad1?w=600"
                    class="w-full h-80 object-cover group-hover:scale-110 duration-500">

                    <button class="absolute bottom-0 left-0 right-0 bg-black text-white py-3
                    translate-y-full group-hover:translate-y-0 duration-500">
                        Add To Cart
                    </button>

                </div>

                <h3 class="mt-4 text-xl font-semibold">
                    Pink Bouquet
                </h3>

                <p class="text-pink-500 text-lg">
                    $52.00
                </p>

            </div>


            <div class="group">

                <div class="overflow-hidden rounded-lg relative">

                    <img src="https://images.unsplash.com/photo-1462275646964-a0e3386b89fa?w=600"
                    class="w-full h-80 object-cover group-hover:scale-110 duration-500">

                    <button class="absolute bottom-0 left-0 right-0 bg-black text-white py-3
                    translate-y-full group-hover:translate-y-0 duration-500">
                        Add To Cart
                    </button>

                </div>

                <h3 class="mt-4 text-xl font-semibold">
                    Sunflower
                </h3>

                <p class="text-pink-500 text-lg">
                    $24.00
                </p>

            </div>


            <div class="group">

                <div class="overflow-hidden rounded-lg relative">

                    <img src="https://images.unsplash.com/photo-1494976388531-d1058494cdd8?w=600"
                    class="w-full h-80 object-cover group-hover:scale-110 duration-500">

                    <button class="absolute bottom-0 left-0 right-0 bg-black text-white py-3
                    translate-y-full group-hover:translate-y-0 duration-500">
                        Add To Cart
                    </button>

                </div>

                <h3 class="mt-4 text-xl font-semibold">
                    Tulips
                </h3>

                <p class="text-pink-500 text-lg">
                    $40.00
                </p>

            </div>


            <div class="group">

                <div class="overflow-hidden rounded-lg relative">

                    <img src="https://images.unsplash.com/photo-1501004318641-b39e6451bec6?w=600"
                    class="w-full h-80 object-cover group-hover:scale-110 duration-500">

                    <button class="absolute bottom-0 left-0 right-0 bg-black text-white py-3
                    translate-y-full group-hover:translate-y-0 duration-500">
                        Add To Cart
                    </button>

                </div>

                <h3 class="mt-4 text-xl font-semibold">
                    Mixed Flowers
                </h3>

                <p class="text-pink-500 text-lg">
                    $36.00
                </p>

            </div>

        </div>

    </div>

</div>

</section>

</body>
</html>
